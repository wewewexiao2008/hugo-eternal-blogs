{{ if not (.Params.hideComments | default false) }}
<div class="comments-section">
  <div class="post-reactions">
    <h3 class="reactions-title">💬 Comments</h3>
    <p class="reactions-hint" data-bloghub-hint></p>
  </div>

  <div id="bloghub-comments" data-path="{{ .RelPermalink }}"></div>
</div>
{{ end }}
